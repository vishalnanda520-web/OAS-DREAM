
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Create Android project
        run: |
          mkdir -p android/ android/app android/app/src/main android/app/src/main/assets android/app/src/main/java/com/opsc/tracker android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OpscTracker"
          include(":app")
          EOF_FILE
          cat > android/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > android/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > android/app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.opsc.tracker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.opsc.tracker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          cat > android/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"
                  tools:ignore="ProtectedPermissions" />
              <application
                  android:label="OPSC Tracker"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          cat > android/app/src/main/java/com/opsc/tracker/MainActivity.kt <<'EOF_FILE'
          package com.opsc.tracker

          import android.app.Activity
          import android.app.NotificationManager
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.setBackgroundColor(Color.parseColor("#070B17"))
                  web.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          view?.evaluateJavascript("document.documentElement.setAttribute('data-theme','dark')", null)
                      }
                  }
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.loadUrl("file:///android_asset/index.html")
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              /** Called from the web page when a focus session starts (on = true) or ends. */
              private fun setMinimal(on: Boolean) {
                  // 1) Do Not Disturb: needs a one-time "Do Not Disturb access" grant from you.
                  val nm = getSystemService(NotificationManager::class.java)
                  if (nm.isNotificationPolicyAccessGranted) {
                      nm.setInterruptionFilter(
                          if (on) NotificationManager.INTERRUPTION_FILTER_NONE
                          else NotificationManager.INTERRUPTION_FILTER_ALL
                      )
                  } else if (on) {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS))
                  }
                  // 2) Grayscale: works only after WRITE_SECURE_SETTINGS is granted once with adb.
                  try {
                      Settings.Secure.putInt(contentResolver, "accessibility_display_daltonizer", 0)
                      Settings.Secure.putInt(contentResolver, "accessibility_display_daltonizer_enabled", if (on) 1 else 0)
                  } catch (e: SecurityException) { /* skipped when not granted */ }
                  // 3) Screen pinning: blocks leaving the app until the session ends.
                  try {
                      if (on) startLockTask() else stopLockTask()
                  } catch (e: Exception) { }
              }

              inner class Bridge {
                  @JavascriptInterface fun minimalOn() { runOnUiThread { setMinimal(true) } }
                  @JavascriptInterface fun minimalOff() { runOnUiThread { setMinimal(false) } }
              }
          }
          EOF_FILE
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M54,27 a27,27 0 1,1 0,54 a27,27 0 1,1 0,-54"
                  android:strokeColor="#E9C46A" android:strokeAlpha="0.28" android:strokeWidth="7" />
              <path android:pathData="M54,27 a27,27 0 1,1 0,54 a27,27 0 1,1 0,-54"
                  android:strokeColor="#E9C46A" android:strokeWidth="7" android:strokeLineCap="round"
                  android:trimPathStart="0" android:trimPathEnd="0.75" />
              <path android:pathData="M41,55 L50,64 L67,44"
                  android:strokeColor="#E9C46A" android:strokeWidth="7"
                  android:strokeLineCap="round" android:strokeLineJoin="round" />
          </vector>
          EOF_FILE
          cat > android/app/src/main/res/values/colors.xml <<'EOF_FILE'
          <resources>
              <color name="ic_launcher_background">#0B1226</color>
          </resources>
          EOF_FILE
          cat > android/app/src/main/res/values/styles.xml <<'EOF_FILE'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/ic_launcher_background</item>
                  <item name="android:statusBarColor">@color/ic_launcher_background</item>
                  <item name="android:navigationBarColor">@color/ic_launcher_background</item>
              </style>
          </resources>
          EOF_FILE
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_FILE
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_FILE
          cp index.html android/app/src/main/assets/index.html
      - name: Build APK
        run: cd android && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OPSC-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
